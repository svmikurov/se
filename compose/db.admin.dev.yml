name: se-dev-db

services:
  admin:
    build:
      target: dev
    working_dir: /app/se/infrastructure/db/admin
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: se.infrastructure.db.admin.config.settings
      DJANGO_DEBUG: "true"
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    ports: ["${ADMIN_HOST_PORT}:${ADMIN_SERVICE_PORT}"]
    volumes:
      - ./src/se/infrastructure/db/admin:/app/se/infrastructure/db/admin
      - ./dumps:/app/dumps
    networks:
      - se-dev-net
      - se-admin-internal
    command: python -m se.infrastructure.db.admin.manage runserver 0.0.0.0:${ADMIN_SERVICE_PORT} --noreload