name: se-e2e

services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/database_password
    secrets:
      - database_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - se-admin-internal

  admin:
    build:
      context: .
      dockerfile: ./docker/db/admin/Dockerfile
      target: dev
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_HOST: postgres
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/admin_secret_key
      DJANGO_DEBUG: "true"
    secrets:
      - database_password
      - admin_secret_key
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    init: true
    networks:
      - se-dev-net
      - se-admin-internal
    volumes:
      - ./src/se/infrastructure/db/admin:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:${ADMIN_SERVICE_PORT} --noreload"

  presentation:
    build:
      context: .
      dockerfile: docker/services/presentation/Dockerfile
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_HOST: postgres
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - se-dev-net
      - se-admin-internal

  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
      target: dev
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: se.entrypoints.web.config.settings
      PRESENTATION_SERVICE_URL: "http://presentation:${PRESENTATION_SERVICE_PORT}"
      DJANGO_SECRET_KEY_FILE: /run/secrets/web_secret_key
      DJANGO_DEBUG: "true"
    secrets:
      - web_secret_key
    init: true
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    networks:
      - se-dev-net
    volumes:
      - ./src/se/entrypoints/web:/app/se/entrypoints/web
      - ./src/se/domain:/app/se/domain
      - ./src/se/infrastructure/api_clients:/app/se/infrastructure/api_clients
      - ./src/se/infrastructure/http_client:/app/se/infrastructure/http_client
    depends_on:
      - presentation
    command: python -m se.entrypoints.web.manage runserver 0.0.0.0:${WEB_SERVICE_PORT} --noreload

  test:
    build:
      context: .
      dockerfile: ./docker/e2e/Dockerfile
    environment:
      BASE_URL: http://web:${WEB_SERVICE_PORT}
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      HEADLESS: "1"
      TEST_RESULTS_DIR: /results
    secrets:
      - database_password
    working_dir: /tests
    networks:
      - se-dev-net
      - se-admin-internal
    volumes:
      - ./tests/web/e2e:/tests:ro
      - ./test-results:/results
    depends_on:
      postgres:
        condition: service_healthy
      admin:
        condition: service_started
      presentation:
        condition: service_started
      web:
        condition: service_started
    shm_size: "1gb"
    init: true

secrets:
  database_password:
    file: ./secrets/database_password
  admin_secret_key:
    file: ./secrets/admin_secret_key
  web_secret_key:
    file: ./secrets/web_secret_key

networks:
  se-dev-net:
  se-admin-internal: