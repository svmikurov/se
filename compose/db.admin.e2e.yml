services:
  admin:
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c 'import urllib.request,sys; r=urllib.request.urlopen(\"http://localhost:${ADMIN_SERVICE_PORT}/\", timeout=2); sys.exit(0 if r.status < 500 else 1)'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  e2e:
    build:
      context: .
      dockerfile: ./docker/e2e/Dockerfile
    working_dir: /tests
    networks:
      - se-dev-net
    volumes:
      - ./tests:/tests:ro              # тесты — read-only
      - ./test-results:/results        # отчёты — ВНЕ /tests, rw
    environment:
      BASE_URL: http://admin:${ADMIN_SERVICE_PORT}
      HEADLESS: "1"
      TEST_RESULTS_DIR: /results       # сообщаем тестам, куда писать
    depends_on:
      admin:
        condition: service_healthy
    shm_size: "1gb"
    init: true
    # command не задан → CMD ["pytest", "-v"] из Dockerfile