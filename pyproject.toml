[project]
name = "se"
version = "0.1.0"
description = "Self education project."
authors = [
    { name = "Sergei Mikurov" ,email = "454004@mail.ru" },
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django>=6.1.2,<7.0.0",
    "se-tools @ git+https://github.com/svmikurov/se-tools.git@v0.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3,<0.18.0",
    "mypy (>=2.4.1,<3.0.0)",
    "django-stubs[compatible-mypy] (>=6.1.2,<7.0.0)",
    "django-stubs-ext (>=6.1.2,<7.0.0)",
]

[tool.poetry]
packages = [{include = "se", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
